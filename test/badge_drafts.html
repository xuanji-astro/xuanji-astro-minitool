const INK='#3b2e26',SOFT='#7a6656',GOLD='#c9a15a',ACC='#e58c4c',LAV='#6f74c4';
const f=x=>x.toFixed(2);
const pol=(deg,r)=>{const t=deg*Math.PI/180;return [150+r*Math.cos(t),150-r*Math.sin(t)]};
// 叶瓣：从半径 r0 到 r1，宽 w，方向 deg
function petal(deg,r0,r1,w,st){const[a,b]=pol(deg,r0),[c,d]=pol(deg,r1),[m1,n1]=pol(deg+Math.atan2(w,(r0+r1)/2)*180/Math.PI,(r0+r1)/2),[m2,n2]=pol(deg-Math.atan2(w,(r0+r1)/2)*180/Math.PI,(r0+r1)/2);
 return '<path d="M'+f(a)+' '+f(b)+' Q'+f(m1)+' '+f(n1)+' '+f(c)+' '+f(d)+' Q'+f(m2)+' '+f(n2)+' '+f(a)+' '+f(b)+'Z" fill="none" '+st+'/>'}
function arcs(r,gaps,gw,st){let s='',g=gaps.map(x=>((x%360)+360)%360).sort((a,b)=>a-b);for(let i=0;i<g.length;i++){const a0=g[i]+gw/2,a1=(i+1<g.length?g[i+1]:g[0]+360)-gw/2;const[x0,y0]=pol(a0,r),[x1,y1]=pol(a1,r);s+='<path d="M'+f(x0)+' '+f(y0)+' A'+r+' '+r+' 0 '+((a1-a0)>180?1:0)+' 0 '+f(x1)+' '+f(y1)+'" fill="none" '+st+'/>'}return s}
// A 莲：八片内瓣（相对两瓣同一种元素，长短看这张盘火土风水各几颗星），八片外瓣，外圈在四轴处断开，心是八芒星
function lotus(c){const rot=180-c.asc%90,els=['火','土','风','水'];let s='';
 s+=arcs(112,[180,0,180+(c.mc-c.asc),(c.mc-c.asc)],16,'stroke="'+GOLD+'" stroke-width="1"');
 for(let k=0;k<8;k++){const deg=rot+22.5+k*45;s+=petal(deg,44,128,9,'stroke="'+SOFT+'" stroke-width="1"');const[x0,y0]=pol(deg,92),[x1,y1]=pol(deg,104);s+='<line x1="'+f(x0)+'" y1="'+f(y0)+'" x2="'+f(x1)+'" y2="'+f(y1)+'" stroke="'+SOFT+'" stroke-width=".9"/>'}
 for(let k=0;k<8;k++){const n=c.el[els[k%4]],len=30+n*10;s+=petal(rot+k*45,16,16+len,len*.3,'stroke="'+INK+'" stroke-width="1.6"')}
 const sq=(o)=>{let p=[];for(let k=0;k<4;k++)p.push(pol(rot+o+k*90,12).map(f).join(' '));return '<polygon points="'+p.join(' ')+'" fill="none" stroke="'+INK+'" stroke-width="1.3"/>'};
 s+=sq(0)+sq(45)+'<circle cx="150" cy="150" r="5.5" fill="none" stroke="'+INK+'" stroke-width="1.3"/>';return s}
// B 八卦：外圈先天八卦（日主五行对应的卦描金），中圈十二宫刻度＋行星点（上升在左），心是公司标志
const TRI={乾:[1,1,1],兑:[0,1,1],离:[1,0,1],震:[0,0,1],巽:[1,1,0],坎:[0,1,0],艮:[1,0,0],坤:[0,0,0]};
const XT=['乾','巽','坎','艮','坤','震','离','兑'];   // 先天八卦：乾上（南），顺时针
const EL2T={金:['乾','兑'],木:['震','巽'],水:['坎'],火:['离'],土:['坤','艮']};
function bagua(c){let s='';s+='<circle cx="150" cy="150" r="92" fill="none" stroke="'+GOLD+'" stroke-width="1"/><circle cx="150" cy="150" r="80" fill="none" stroke="'+GOLD+'" stroke-width=".6" stroke-dasharray="1.5 3"/>';
 XT.forEach((t,k)=>{const deg=90-k*45,hi=(EL2T[c.dm]||[]).includes(t),col=hi?ACC:INK;for(let j=0;j<3;j++){const r=108+j*9,half=15,lines=TRI[t][j]?[[-half,half]]:[[-half,-4],[4,half]];
  for(const[a,b] of lines){const t0=deg+a*180/Math.PI/r,t1=deg+b*180/Math.PI/r;const[x0,y0]=pol(t0,r),[x1,y1]=pol(t1,r);s+='<path d="M'+f(x0)+' '+f(y0)+' A'+r+' '+r+' 0 0 1 '+f(x1)+' '+f(y1)+'" fill="none" stroke="'+col+'" stroke-width="3.6" stroke-linecap="butt"/>'}}});
 for(let k=0;k<12;k++){const deg=180+(k*30-c.asc);const[x0,y0]=pol(deg,86),[x1,y1]=pol(deg,95);s+='<line x1="'+f(x0)+'" y1="'+f(y0)+'" x2="'+f(x1)+'" y2="'+f(y1)+'" stroke="'+GOLD+'" stroke-width=".9"/>'}
 for(const p of c.planets){const[x,y]=pol(180+(p.L-c.asc),70);s+='<circle cx="'+f(x)+'" cy="'+f(y)+'" r="2.2" fill="'+INK+'"/>'}
 s+='<circle cx="150" cy="150" r="40" fill="#fffdfa" stroke="'+GOLD+'" stroke-width=".8"/><image href="'+MARK+'" x="122" y="122" width="56" height="56"/>';return s}
// C 星芒：八芒针星（四根长芒看火土风水，四根短芒固定），外两圈刻度，行星点落在外圈（上升在左）
function star(c){let s='<defs><radialGradient id="gl"><stop offset="0" stop-color="#ffe6b8" stop-opacity=".9"/><stop offset="1" stop-color="#ffe6b8" stop-opacity="0"/></radialGradient></defs><circle cx="150" cy="150" r="70" fill="url(#gl)"/>';
 s+='<circle cx="150" cy="150" r="118" fill="none" stroke="'+GOLD+'" stroke-width="1"/><circle cx="150" cy="150" r="106" fill="none" stroke="'+GOLD+'" stroke-width=".6"/>';
 for(let k=0;k<72;k++){const deg=k*5,L=k%6===0?8:3;const[x0,y0]=pol(deg,106),[x1,y1]=pol(deg,106+L);s+='<line x1="'+f(x0)+'" y1="'+f(y0)+'" x2="'+f(x1)+'" y2="'+f(y1)+'" stroke="'+GOLD+'" stroke-width=".6"/>'}
 for(const p of c.planets){const[x,y]=pol(180+(p.L-c.asc),112);s+='<circle cx="'+f(x)+'" cy="'+f(y)+'" r="2.4" fill="'+INK+'"/>'}
 const els=['火','土','风','水'],pts=[];for(let k=0;k<8;k++){const deg=90+k*45,long=k%2===0,R=long?44+c.el[els[k/2]]*9:30;pts.push(pol(deg,R));pts.push(pol(deg+22.5,4.2))}
 s+='<polygon points="'+pts.map(p=>p.map(f).join(' ')).join(' ')+'" fill="'+INK+'"/><circle cx="150" cy="150" r="7" fill="'+ACC+'"/><circle cx="150" cy="150" r="2.6" fill="#fffdfa"/>';return s}
